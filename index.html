<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MD File Grabber — Tải tệp từ Markdown</title>
<meta name="description" content="Dán Markdown và trích xuất, tải xuống mọi tệp được nhúng — kể cả trong code block và tải tất cả thành một file ZIP." />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='%230b0e14'/%3E%3Cpath d='M256 120v190' stroke='url(%23g)' stroke-width='36' stroke-linecap='round'/%3E%3Cpath d='M178 250l78 78 78-78' fill='none' stroke='url(%23g)' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='140' y='368' width='232' height='36' rx='18' fill='url(%23g)'/%3E%3C/svg%3E" />

<meta name="mobile-web-app-capable" content="yes" />

<style>
:root{
  --bg:#0b0e14; --panel:#111722; --line:#1e2a3a; --line-2:#26364a;
  --text:#e7eef8; --muted:#8296b0;
  --accent:#38bdf8; --accent-2:#a78bfa; --ok:#34d399; --danger:#f87171;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 8% -10%, #16233a 0%, transparent 60%),
    radial-gradient(1000px 520px at 108% 8%, #251a3d 0%, transparent 55%),
    var(--bg);
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
@media (min-width:901px){ body{ overflow:hidden; } }

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-top)) 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(11,14,20,.72);
  backdrop-filter:blur(12px);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{width:30px; height:30px; flex:none; border-radius:9px; box-shadow:0 6px 18px -8px var(--accent)}
.brand h1{
  font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.brand small{display:block; font-size:11px; color:var(--muted); font-weight:500}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line-2); background:#16202e; color:var(--text);
  padding:8px 12px; border-radius:10px; font-size:13px; font-weight:600;
  cursor:pointer; transition:background .15s,border-color .15s,transform .06s,filter .15s;
  white-space:nowrap; font-family:inherit; line-height:1.1;
}
.btn:hover{background:#1c2839; border-color:#31465f}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  border-color:transparent; color:#fff;
  box-shadow:0 8px 22px -12px #0ea5e9;
}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55; cursor:not-allowed}
.icon-btn{
  flex:none; width:34px; height:34px; display:grid; place-items:center;
  border-radius:9px; border:1px solid var(--line-2); background:#16202e;
  color:var(--accent); font-size:15px; cursor:pointer; transition:.15s;
}
.icon-btn:hover{background:#1d2a3c; border-color:#33495f}
.icon-btn:disabled{opacity:.5; cursor:progress}

/* ---------- Layout ---------- */
.grid{
  flex:1; min-height:0; width:100%; max-width:1500px; margin:0 auto;
  display:grid; gap:14px; padding:14px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
@media (max-width:900px){
  .grid{grid-template-columns:1fr; flex:none}
  body{height:auto; min-height:100%; overflow:auto}
  .panel{min-height:330px}
}

.panel{
  background:linear-gradient(180deg,#121a26,#0f151f);
  border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
  box-shadow:0 20px 50px -40px #000;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.panel-head h2{
  margin:0; font-size:12px; font-weight:700; letter-spacing:.9px;
  text-transform:uppercase; color:var(--muted);
}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

/* ---------- Textarea ---------- */
#md{
  flex:1; min-height:180px; width:100%; resize:none; border:0; outline:0;
  background:transparent; color:var(--text); padding:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:13px; line-height:1.6; tab-size:2;
}
#md::placeholder{color:#4d5f77}
#md.drag{background:rgba(56,189,248,.07); box-shadow:inset 0 0 0 2px var(--accent)}
.stats{
  padding:7px 12px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap;
}
.stats b{color:var(--accent); font-weight:700}

/* ---------- List ---------- */
.list{list-style:none; margin:0; padding:0; overflow:auto; flex:1; min-height:0; overscroll-behavior:contain}
.item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-bottom:1px solid var(--line);
  transition:background .15s;
}
.item:hover{background:#0f1620}
.item.done{opacity:.45}
.cb{
  flex:none; width:16px; height:16px; accent-color:var(--accent);
  cursor:pointer; margin:0;
}
.meta{flex:1; min-width:0}
.nm{
  font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; color:#dbe7f5;
}
.ur{
  font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; direction:rtl; text-align:left; margin-top:2px;
}
.badge{
  flex:none; font-size:10.5px; font-weight:700; letter-spacing:.4px;
  text-transform:uppercase; padding:4px 8px; border-radius:999px;
  background:rgba(56,189,248,.12); color:var(--accent);
  border:1px solid rgba(56,189,248,.25);
}
.badge.muted{background:rgba(130,150,176,.1); color:var(--muted); border-color:rgba(130,150,176,.22)}
.badge.code{
  background:rgba(167,139,250,.14); color:var(--accent-2);
  border-color:rgba(167,139,250,.28);
}

.empty{
  padding:34px 20px; text-align:center; color:var(--muted);
  font-size:13px; line-height:1.7; margin:auto 0;
}
.chk{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
  color:var(--muted); cursor:pointer; user-select:none;
}
.chk input{accent-color:var(--accent); width:15px; height:15px; margin:0}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%, 24px); opacity:0; pointer-events:none;
  background:#1a2434; border:1px solid var(--line-2); color:var(--text);
  padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600;
  box-shadow:0 18px 40px -18px #000; z-index:100;
  transition:opacity .22s, transform .22s; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
</style>

<script>
'use strict';

/* =========================================================
   ALL-IN-ONE PWA BOOTSTRAP
   - Tạo manifest.json động → Blob URL
   - Tạo sw.js động → Blob URL (scope tự động)
   - Nạp JSZip từ CDN (có fallback)
   Lưu ý: SW chỉ hoạt động khi chạy qua http(s)://, không chạy file://
   ========================================================= */
(function bootstrapPWA(){
  /* ---------- Manifest động ---------- */
  const ICON_SVG =
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0' stop-color='#38bdf8'/><stop offset='1' stop-color='#a78bfa'/>" +
    "</linearGradient></defs>" +
    "<rect width='512' height='512' rx='112' fill='#0b0e14'/>" +
    "<path d='M256 120v190' stroke='url(#g)' stroke-width='36' stroke-linecap='round'/>" +
    "<path d='M178 250l78 78 78-78' fill='none' stroke='url(#g)' stroke-width='36' " +
    "stroke-linecap='round' stroke-linejoin='round'/>" +
    "<rect x='140' y='368' width='232' height='36' rx='18' fill='url(#g)'/></svg>";

  const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON_SVG);

  const manifest = {
    name: 'MD File Grabber — Tải tệp từ Markdown',
    short_name: 'MD Grabber',
    description: 'Dán Markdown, trích xuất và tải mọi tệp được nhúng — kể cả trong code block và tải tất cả thành một file ZIP.',
    start_url: './',
    scope: './',
    display: 'standalone',
    orientation: 'any',
    background_color: '#0b0e14',
    theme_color: '#0b0e14',
    lang: 'vi',
    categories: ['productivity', 'utilities'],
    icons: [
      { src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
      { src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
    ]
  };

  try {
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);
  } catch (_) { /* ignore */ }

  /* ---------- Service Worker động ---------- */
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;

  const SW_CODE = `
    const CACHE = 'md-grabber-inline-v1';
    const PRECACHE = ['./', location.href.split('#')[0]];

    self.addEventListener('install', (e) => {
      e.waitUntil(
        caches.open(CACHE)
          .then(c => c.addAll(PRECACHE.map(u => new Request(u, {cache:'reload'}))))
          .catch(() => {})
          .then(() => self.skipWaiting())
      );
    });

    self.addEventListener('activate', (e) => {
      e.waitUntil(
        caches.keys()
          .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
          .then(() => self.clients.claim())
      );
    });

    self.addEventListener('fetch', (e) => {
      const req = e.request;
      if (req.method !== 'GET') return;

      if (req.mode === 'navigate') {
        e.respondWith(fetch(req).catch(() => caches.match(req).then(r => r || caches.match('./'))));
        return;
      }

      e.respondWith(
        caches.match(req).then(cached => {
          if (cached) {
            fetch(req).then(res => {
              if (res && res.ok) caches.open(CACHE).then(c => c.put(req, res));
            }).catch(() => {});
            return cached;
          }
          return fetch(req).then(res => {
            const sameOrigin = req.url.startsWith(self.location.origin);
            const isCdn = /cdn\\.jsdelivr\\.net|cdnjs\\.cloudflare\\.com/.test(req.url);
            if (res && res.ok && (sameOrigin || isCdn)) {
              const clone = res.clone();
              caches.open(CACHE).then(c => c.put(req, clone));
            }
            return res;
          });
        })
      );
    });
  `;

  try {
    const swBlob = new Blob([SW_CODE], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(swUrl, { scope: './' }).catch(() => {});
    });
  } catch (_) { /* ignore */ }
})();
</script>

<script>
'use strict';

/* =========================================================
   DOM
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const mdEl       = $('#md');
const listEl     = $('#list');
const emptyEl    = $('#empty');
const statsEl    = $('#stats');
const toastEl    = $('#toast');
const onlyFiles  = $('#onlyFiles');
const dlAllBtn   = $('#dlAll');
const zipBtn     = $('#zipAll');
const DL_LABEL   = dlAllBtn.textContent;
const ZIP_LABEL  = zipBtn.textContent;

/* =========================================================
   State
   ========================================================= */
let all = [];
let sel = new Set();

/* =========================================================
   Hằng số lọc nhiễu
   ========================================================= */
const SKIP_PROTO = /^(javascript|vbscript|mailto|tel|sms|blob):/i;
const IGNORE_HOST = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|schema\.org|www\.w3\.org|w3\.org|example\.(com|org)|your-domain\.com)$/i;

/* =========================================================
   Trích xuất liên kết từ Markdown
   ========================================================= */
function normalizeUrl(raw) {
  let u = (raw || '').trim();
  if (u.startsWith('<') && u.endsWith('>')) u = u.slice(1, -1).trim();
  return u;
}

function splitFences(md) {
  const codes = [];
  const TEXT = [];
  let i = 0, n = md.length;
  let buf = '';

  while (i < n) {
    const rest = md.slice(i);
    const open = /^[ \t]{0,3}(`{3,}|~{3,})[^\n]*\n?/m.exec(rest);
    if (!open) { buf += rest; break; }

    buf += rest.slice(0, open.index);
    const fence = open[1][0];
    const fenceLen = open[1].length;
    const bodyStart = i + open.index + open[0].length;

    const closeRe = new RegExp(
      '^[ \\t]{0,3}' + (fence === '`' ? '`' : '~') + '{' + fenceLen + ',}[ \\t]*$', 'm'
    );
    const after = md.slice(bodyStart);
    const close = closeRe.exec(after);

    if (!close) {
      codes.push({ lang: '', body: after });
      TEXT.push('\u0000CODE' + (codes.length - 1) + '\u0000');
      i = n; break;
    }

    const body = after.slice(0, close.index);
    codes.push({ lang: (open[0].match(/\S+/g) || [''])[1] || '', body });
    TEXT.push('\u0000CODE' + (codes.length - 1) + '\u0000');
    i = bodyStart + close.index + close[0].length;
    while (md[i] === '\n' || md[i] === '\r') i++;
  }

  return { text: buf + TEXT.join(''), codes };
}

function collectFromCode(body, out) {
  const add = (u) => {
    u = normalizeUrl(u);
    if (!u || SKIP_PROTO.test(u) || u.startsWith('#')) return;
    out.push({ url: u, label: '', kind: 'code' });
  };

  let m;
  const reBare = /\b(?:https?|ftp|data):[^\s"'`<>()\[\]{}]+/gi;
  while ((m = reBare.exec(body))) add(m[0]);

  const reStr = /["'`]((?:https?|ftp|data):[^"'`\s]+)["'`]/gi;
  while ((m = reStr.exec(body))) add(m[1]);

  const reAttr = /\b(?:src|href)\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s>]+))/gi;
  while ((m = reAttr.exec(body))) add(m[1] ?? m[2] ?? m[3]);

  const reMd = /\[([^\]\n]*)\]\(\s*(<[^>\n]*>|[^)\s]+)(?:\s+["'(][^)"']*["')])?\s*\)/g;
  while ((m = reMd.exec(body))) add(m[2]);
}

function collect(md) {
  const found = [];
  const add = (url, label = '', kind = 'link') => {
    url = normalizeUrl(url);
    if (!url || SKIP_PROTO.test(url) || url.startsWith('#')) return;

    if (kind !== 'code') {
      let host = '';
      try { host = new URL(url, location.href).hostname; } catch (_) {}
      if (host && IGNORE_HOST.test(host)) return;
    }
    found.push({ url, label, kind });
  };

  const { text, codes } = splitFences(md);
  let m;

  const reInline = /(!?)\[([^\]\n]*)\]\(\s*(<[^>\n]*>|[^)\s]+)(?:\s+(?:"[^"\n]*"|'[^'\n]*'|\([^)\n]*\)))?\s*\)/g;
  while ((m = reInline.exec(text))) {
    add(m[3], m[2], m[1] === '!' ? 'image' : 'link');
  }

  const reRef = /^[ \t]{0,3}\[([^\]\n]+)\]:[ \t]*(<[^>\n]*>|\S+)/gm;
  while ((m = reRef.exec(text))) add(m[2], m[1], 'ref');

  const reHtml = /\b(?:href|src)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi;
  while ((m = reHtml.exec(text))) add(m[1] ?? m[2] ?? m[3], '', 'html');

  const reAuto = /<((?:https?|ftp):\/\/[^>\s]+)>/gi;
  while ((m = reAuto.exec(text))) add(m[1], '', 'auto');

  const reBare = /\b(?:https?|ftp):\/\/[^\s<>"'`)\]]+/gi;
  while ((m = reBare.exec(text))) {
    const prev = text[m.index - 1];
    if (prev && /[[(<"'=]/.test(prev)) continue;
    add(m[0], '', 'bare');
  }

  for (const c of codes) collectFromCode(c.body, found);

  return found;
}

/* =========================================================
   Nhận diện tệp
   ========================================================= */
const MIME_EXT = {
  'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/gif':'gif',
  'image/webp':'webp','image/svg+xml':'svg','image/avif':'avif','image/bmp':'bmp',
  'application/pdf':'pdf','application/zip':'zip','application/json':'json',
  'application/x-zip-compressed':'zip','application/octet-stream':'bin',
  'text/plain':'txt','text/csv':'csv','text/html':'html','text/markdown':'md',
  'audio/mpeg':'mp3','audio/wav':'wav','video/mp4':'mp4','video/webm':'webm'
};

function fileInfo(url) {
  if (/^data:/i.test(url)) {
    const mm = /^data:([^;,]*)/i.exec(url);
    const mime = ((mm && mm[1]) || '').toLowerCase();
    let ext = MIME_EXT[mime];
    if (!ext && mime.includes('/')) {
      ext = mime.split('/')[1].replace(/[^a-z0-9]/g, '').slice(0, 6) || 'bin';
    }
    ext = ext || 'bin';
    return { ext, base: 'data.' + ext, isFile: true };
  }

  let path = '';
  try { path = new URL(url, location.href).pathname; }
  catch { path = url.split(/[?#]/)[0]; }

  let base = path.split('/').filter(Boolean).pop() || '';
  try { base = decodeURIComponent(base); } catch (_) {}

  const mm = /\.([a-z0-9]{1,8})$/i.exec(base);
  return { ext: mm ? mm[1].toLowerCase() : '', base, isFile: !!mm };
}

/* =========================================================
   Phân tích & khử trùng lặp
   ========================================================= */
function analyze(md) {
  const raw = collect(md);
  const map = new Map();

  for (const r of raw) {
    if (map.has(r.url)) {
      const e = map.get(r.url);
      if (!e.label && r.label) e.label = r.label;
      continue;
    }
    const info = fileInfo(r.url);
    map.set(r.url, {
      id: Math.random().toString(36).slice(2, 9),
      url: r.url,
      label: r.label || '',
      kind: r.kind,
      ext: info.ext,
      base: info.base,
      isFile: info.isFile
    });
  }
  return [...map.values()];
}

/* =========================================================
   Tên tệp
   ========================================================= */
function fileName(it) {
  const label = (it.label || '').trim();
  if (label && /\.[a-z0-9]{1,8}$/i.test(label) && !/[\/\\:*?"<>|]/.test(label)) {
    return label;
  }
  if (it.base) return it.base;
  if (label) {
    return label.replace(/[\/\\:*?"<>|]+/g, '_').slice(0, 80) + (it.ext ? '.' + it.ext : '');
  }
  return 'download' + (it.ext ? '.' + it.ext : '');
}

function safeZipName(name) {
  return name
    .replace(/[\/\\:*?"<>|\x00-\x1f]/g, '_')
    .replace(/^\.+/, '')
    .trim() || 'file';
}

/* =========================================================
   Render
   ========================================================= */
function visibleItems() {
  const only = onlyFiles.checked;
  return only ? all.filter(i => i.isFile) : all.slice();
}

function render() {
  const vis = visibleItems();
  const codeCount = all.filter(i => i.kind === 'code').length;

  statsEl.innerHTML =
    `<b>${all.length}</b> liên kết · ` +
    `<b>${all.filter(i => i.isFile).length}</b> tệp` +
    (codeCount ? ` · <b>${codeCount}</b> trong code` : '');

  listEl.innerHTML = '';
  emptyEl.hidden = vis.length > 0;
  emptyEl.textContent = all.length
    ? 'Không có tệp nào khớp bộ lọc. Bỏ chọn “Chỉ tệp” để xem tất cả liên kết.'
    : 'Chưa có gì. Dán Markdown ở khung bên trái.';

  const frag = document.createDocumentFragment();
  for (const it of vis) frag.appendChild(renderItem(it));
  listEl.appendChild(frag);
}

function renderItem(it) {
  const li = document.createElement('li');
  li.className = 'item';
  li.dataset.id = it.id;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'cb';
  cb.checked = sel.has(it.url);
  cb.addEventListener('change', () => {
    if (cb.checked) sel.add(it.url); else sel.delete(it.url);
  });

  const meta = document.createElement('div');
  meta.className = 'meta';

  const nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = fileName(it);
  nm.title = fileName(it);

  const ur = document.createElement('div');
  ur.className = 'ur';
  ur.textContent = it.url;
  ur.title = it.url;

  meta.append(nm, ur);

  const badge = document.createElement('span');
  badge.className = 'badge';
  if (it.kind === 'code') {
    badge.classList.add('code');
    badge.textContent = 'code';
    badge.title = 'Link trích từ code block';
  } else {
    badge.textContent = it.ext
      ? '.' + it.ext
      : (it.kind === 'image' ? 'img' : 'link');
    if (!it.isFile) badge.classList.add('muted');
  }

  const btn = document.createElement('button');
  btn.className = 'icon-btn';
  btn.type = 'button';
  btn.title = 'Tải xuống';
  btn.textContent = '⬇';
  btn.addEventListener('click', () => downloadOne(it, li));

  li.append(cb, meta, badge, btn);
  return li;
}

/* =========================================================
   Tải xuống đơn lẻ
   ========================================================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

function dataUrlToBlob(url) {
  const comma = url.indexOf(',');
  const head = url.slice(0, comma);
  const body = url.slice(comma + 1);
  const mimeMatch = /data:([^;,]*)/i.exec(head);
  const mime = (mimeMatch && mimeMatch[1]) || 'application/octet-stream';

  if (/;base64/i.test(head)) {
    const bin = atob(body.replace(/\s/g, ''));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  return new Blob([decodeURIComponent(body)], { type: mime });
}

async function saveItem(it) {
  const name = fileName(it);
  try {
    if (/^data:/i.test(it.url)) {
      saveBlob(dataUrlToBlob(it.url), name);
      return 'fetched';
    }
    const res = await fetch(it.url, {
      mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    saveBlob(await res.blob(), name);
    return 'fetched';
  } catch (_) {
    try {
      const a = document.createElement('a');
      a.href = it.url;
      a.download = name;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return 'opened';
    } catch (_) { return 'failed'; }
  }
}

async function downloadOne(it, li) {
  const btn = li && li.querySelector('.icon-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  const r = await saveItem(it);
  if (btn) { btn.disabled = false; btn.textContent = '⬇'; }

  if (r === 'fetched') toast('Đã tải: ' + fileName(it));
  else if (r === 'opened') toast('Đã mở liên kết (CORS chặn, trình duyệt tự xử lý)');
  else toast('Không tải được tệp này');
}

async function downloadAll() {
  const vis = visibleItems().filter(it => sel.has(it.url));
  if (!vis.length) return toast('Chưa chọn tệp nào');

  dlAllBtn.disabled = true; zipBtn.disabled = true;
  let fetched = 0, opened = 0, failed = 0;

  for (let i = 0; i < vis.length; i++) {
    dlAllBtn.textContent = `Đang tải ${i + 1}/${vis.length}…`;
    const li = listEl.querySelector(`[data-id="${vis[i].id}"]`);
    const r = await saveItem(vis[i]);
    if (r === 'fetched') fetched++;
    else if (r === 'opened') opened++;
    else failed++;
    if (li) li.classList.add('done');
    await sleep(350);
  }

  dlAllBtn.textContent = DL_LABEL;
  dlAllBtn.disabled = false; zipBtn.disabled = false;

  toast(
    `Xong: ${fetched} tải trực tiếp` +
    (opened ? `, ${opened} mở tab` : '') +
    (failed ? `, ${failed} lỗi` : '')
  );
}

/* =========================================================
   📦 Tải tất cả thành ZIP (JSZip CDN)
   ========================================================= */
async function downloadZip() {
  const vis = visibleItems().filter(it => sel.has(it.url));
  if (!vis.length) return toast('Chưa chọn tệp nào');

  if (typeof JSZip === 'undefined') {
    return toast('Không tải được thư viện ZIP — kiểm tra kết nối mạng');
  }

  dlAllBtn.disabled = true;
  zipBtn.disabled = true;
  const zip = new JSZip();
  const used = new Set();
  let added = 0, failed = 0;

  for (let i = 0; i < vis.length; i++) {
    zipBtn.textContent = `Đang tải ${i + 1}/${vis.length}…`;
    try {
      let blob;
      if (/^data:/i.test(vis[i].url)) {
        blob = dataUrlToBlob(vis[i].url);
      } else {
        const res = await fetch(vis[i].url, {
          mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        blob = await res.blob();
      }

      let name = safeZipName(fileName(vis[i]));
      if (used.has(name)) {
        const dot = name.lastIndexOf('.');
        const base = dot > 0 ? name.slice(0, dot) : name;
        const ext  = dot > 0 ? name.slice(dot)    : '';
        let n = 1;
        while (used.has(`${base} (${n})${ext}`)) n++;
        name = `${base} (${n})${ext}`;
      }
      used.add(name);
      zip.file(name, blob);
      added++;
    } catch (_) {
      failed++;
    }
    await sleep(80);
  }

  if (!added) {
    dlAllBtn.disabled = false;
    zipBtn.disabled = false;
    zipBtn.textContent = ZIP_LABEL;
    return toast('Không tệp nào tải được (bị CORS chặn). Thử tải lẻ.');
  }

  zipBtn.textContent = 'Đang nén…';
  try {
    const blob = await zip.generateAsync(
      { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
      (meta) => { zipBtn.textContent = `Nén ${Math.round(meta.percent)}%…`; }
    );
    const stamp = new Date().toISOString().slice(0, 10);
    saveBlob(blob, `markdown-files-${stamp}.zip`);
    const sizeMB = (blob.size / 1048576).toFixed(2);
    toast(
      `📦 Đã tạo ZIP: ${added} tệp · ${sizeMB} MB` +
      (failed ? ` (bỏ qua ${failed} tệp lỗi)` : '')
    );
  } catch (e) {
    toast('Lỗi khi tạo ZIP');
  }

  dlAllBtn.disabled = false;
  zipBtn.disabled = false;
  zipBtn.textContent = ZIP_LABEL;
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

/* =========================================================
   Refresh
   ========================================================= */
function refresh() {
  all = analyze(mdEl.value);
  sel = new Set(all.map(i => i.url));
  render();
}

let debounceTimer;
mdEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(refresh, 220);
});

onlyFiles.addEventListener('change', render);
dlAllBtn.addEventListener('click', downloadAll);
zipBtn.addEventListener('click', downloadZip);

/* =========================================================
   Sự kiện UI
   ========================================================= */
$('#pasteBtn').addEventListener('click', async () => {
  try {
    const txt = await navigator.clipboard.readText();
    if (!txt) return toast('Clipboard đang trống');
    mdEl.value = txt;
    refresh();
    toast('Đã dán Markdown');
  } catch (_) {
    toast('Không đọc được clipboard — hãy dán thủ công (Ctrl/⌘+V)');
  }
});

$('#clearBtn').addEventListener('click', () => {
  mdEl.value = '';
  refresh();
  mdEl.focus();
});

$('#fileInput').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  mdEl.value = await f.text();
  refresh();
  toast('Đã nạp ' + f.name);
  e.target.value = '';
});

$('#copyAll').addEventListener('click', async () => {
  const vis = visibleItems().filter(i => sel.has(i.url));
  if (!vis.length) return toast('Chưa có liên kết nào');
  try {
    await navigator.clipboard.writeText(vis.map(i => i.url).join('\n'));
    toast(`Đã copy ${vis.length} liên kết`);
  } catch (_) { toast('Không copy được'); }
});

['dragenter', 'dragover'].forEach(ev =>
  mdEl.addEventListener(ev, e => { e.preventDefault(); mdEl.classList.add('drag'); })
);
['dragleave', 'drop'].forEach(ev =>
  mdEl.addEventListener(ev, e => { e.preventDefault(); mdEl.classList.remove('drag'); })
);
mdEl.addEventListener('drop', async (e) => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  mdEl.value = await f.text();
  refresh();
  toast('Đã nạp ' + f.name);
});

mdEl.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    refresh();
    toast('Đã quét Markdown');
  }
});

/* =========================================================
   PWA install prompt
   ========================================================= */
let deferredPrompt = null;
const installBtn = $('#installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.hidden = false;
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.hidden = true;
});

window.addEventListener('appinstalled', () => {
  installBtn.hidden = true;
  toast('Đã cài đặt ứng dụng 🎉');
});

/* Khởi tạo */
refresh();
</script>
</body>
</html>
