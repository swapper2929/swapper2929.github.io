<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>🏓 Ping Pong QR</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Ping Pong QR","short_name":"PingPong","start_url":".","display":"standalone","background_color":"%230f172a","theme_color":"%230f172a","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjMyIiBmaWxsPSIjMGYxNzJhIi8+PHRleHQgeD0iOTYiIHk9IjEyMCIgZm9udC1zaXplPSI5NiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+8J+SjzwvdGV4dD48L3N2Zz4=","sizes":"192x192","type":"image/svg+xml"}]}' />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    color: #e2e8f0; overflow-x: hidden; touch-action: manipulation;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px; gap: 14px;
  }
  h1 {
    font-size: 1.5rem; letter-spacing: 1px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .screen {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: 520px; align-items: center;
  }
  .hidden { display: none !important; }

  .btn {
    padding: 12px 22px; border: none; border-radius: 10px;
    background: #334155; color: #f1f5f9; font-size: 1rem;
    font-weight: 600; cursor: pointer; width: 100%; max-width: 340px;
    transition: transform .15s, background .2s;
  }
  .btn:hover { background: #475569; transform: translateY(-2px); }
  .btn.primary {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    box-shadow: 0 8px 20px rgba(56,189,248,.3);
  }
  .btn.ghost { background: transparent; border: 1px solid #334155; }

  .card {
    width: 100%; background: #0b1220; border: 1px solid #1e293b;
    border-radius: 14px; padding: 18px; display: flex;
    flex-direction: column; gap: 12px; align-items: center;
    animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .qr-wrap {
    background: #fff; padding: 12px; border-radius: 12px;
    display: inline-block; box-shadow: 0 0 30px rgba(56,189,248,.25);
  }
  .qr-wrap canvas { display: block; width: 260px; height: 260px; }

  .room-code {
    font-family: ui-monospace, monospace; font-size: 2rem;
    font-weight: 800; letter-spacing: 6px; color: #38bdf8;
    text-shadow: 0 0 20px rgba(56,189,248,.5);
  }
  .label { font-size: .85rem; color: #94a3b8; text-align: center; line-height: 1.5; }
  .hint { font-size: .78rem; color: #64748b; text-align: center; line-height: 1.5; }
  .badge {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    background: #1e293b; color: #38bdf8; font-size: .78rem; font-weight: 600;
  }

  #game { max-width: 100%; }
  canvas#canvas {
    width: 100%; max-width: 800px; height: auto;
    background: #020617; border-radius: 12px;
    box-shadow: 0 0 40px rgba(56,189,248,.2);
    border: 2px solid #1e293b; display: block;
  }
  #status { text-align: center; color: #94a3b8; font-size: .9rem; margin-top: 8px; }
  #scoreboard {
    display: flex; justify-content: space-between; width: 100%;
    max-width: 800px; font-size: 1.5rem; font-weight: 700; padding: 0 12px;
  }
  #scoreboard span:first-child { color: #38bdf8; }
  #scoreboard span:last-child { color: #a78bfa; }

  /* Loading dots */
  .dots::after { content: ''; animation: dots 1.5s infinite; }
  @keyframes dots { 0%,20%{content:'';} 40%{content:'.';} 60%{content:'..';} 80%,100%{content:'...';} }

  @media (max-width: 600px) {
    h1 { font-size: 1.25rem; }
    .qr-wrap canvas { width: 220px; height: 220px; }
    .room-code { font-size: 1.6rem; letter-spacing: 4px; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🏓 Ping Pong QR</h1>

  <!-- ============ MENU ============ -->
  <div id="menu" class="screen">
    <button id="btnCreate" class="btn primary">🎮 Tạo phòng</button>
    <button id="btnJoin" class="btn">🔑 Nhập mã phòng</button>
    <div id="joinBox" class="hidden" style="width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;">
      <input id="roomInput" maxlength="4" placeholder="MÃ 4 KÝ TỰ"
        style="width:100%;max-width:340px;padding:14px;border-radius:10px;
        border:1px solid #334155;background:#1e293b;color:#38bdf8;
        font-size:1.5rem;text-align:center;letter-spacing:8px;
        font-weight:700;text-transform:uppercase;outline:none;" />
      <button id="btnJoinGo" class="btn primary">Vào phòng</button>
    </div>
    <p class="hint">Host tạo phòng → hiện QR → Guest quét là chơi luôn<br>
    Không cần copy code, không cần quét QR lần 2</p>
  </div>

  <!-- ============ HOST ============ -->
  <div id="hostScreen" class="screen hidden">
    <span class="badge">🎮 HOST — PADDLE TRÁI</span>
    <div class="card">
      <div class="label">📱 Quét QR để vào phòng:</div>
      <div class="qr-wrap"><canvas id="qrCanvas"></canvas></div>
      <div class="label">hoặc nhập mã phòng:</div>
      <div class="room-code" id="roomCodeEl">----</div>
      <button id="btnCopyLink" class="btn ghost">📋 Copy link phòng</button>
    </div>
    <div class="card">
      <div class="label dots" id="hostStatus">Đang chờ người chơi</div>
    </div>
  </div>

  <!-- ============ GUEST ============ -->
  <div id="guestScreen" class="screen hidden">
    <span class="badge">🎮 GUEST — PADDLE PHẢI</span>
    <div class="card">
      <div class="label dots" id="guestStatus">Đang kết nối tới phòng...</div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen hidden">
    <div id="scoreboard">
      <span id="scoreLeft">0</span>
      <span id="scoreRight">0</span>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div id="status">Đang chơi...</div>
  </div>
</div>

<!-- PeerJS (signaling server công cộng miễn phí) + QR generator -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
/* =========================================================
   PWA Service Worker
========================================================= */
if ("serviceWorker" in navigator) {
  const sw = `self.addEventListener('install',e=>self.skipWaiting());
              self.addEventListener('activate',e=>self.clients.claim());`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type:"text/javascript"}))).catch(()=>{});
}

/* =========================================================
   GOOGLE STUN — chỉ định rõ cho PeerJS dùng
========================================================= */
const PEER_CONFIG = {
  debug: 1,
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      { urls: "stun:stun3.l.google.com:19302" },
      { urls: "stun:stun4.l.google.com:19302" }
    ],
    iceCandidatePoolSize: 10
  }
};

/* =========================================================
   DOM
========================================================= */
const $ = id => document.getElementById(id);
const menuEl = $("menu"), hostEl = $("hostScreen"), guestEl = $("guestScreen");
const gameEl = $("game"), statusEl = $("status");
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const scoreLeftEl = $("scoreLeft"), scoreRightEl = $("scoreRight");

/* =========================================================
   Sinh mã phòng 4 ký tự (A-Z, không trùng lặp khó đọc)
========================================================= */
const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newRoomCode() {
  let s = "";
  for (let i = 0; i < 4; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
  return s;
}
function peerIdFromCode(code) { return "ppong-" + code.toUpperCase(); }

/* =========================================================
   QR generator (vẽ vào canvas)
========================================================= */
async function drawQR(text) {
  await QRCode.toCanvas($("qrCanvas"), text, {
    width: 260, margin: 1, errorCorrectionLevel: "M",
    color: { dark: "#0f172a", light: "#ffffff" }
  });
}

/* =========================================================
   WEBRTC STATE
========================================================= */
let peer = null, conn = null;
let role = null;   // "host" | "guest"

/* =========================================================
   HOST: tạo phòng
========================================================= */
$("btnCreate").onclick = () => {
  role = "host";
  const code = newRoomCode();
  const peerId = peerIdFromCode(code);

  $("roomCodeEl").textContent = code;
  const url = location.origin + location.pathname + "?r=" + code;
  window._roomURL = url;
  window._roomCode = code;

  menuEl.classList.add("hidden");
  hostEl.classList.remove("hidden");

  $("hostStatus").textContent = "Đang kết nối tới signaling server";

  peer = new Peer(peerId, PEER_CONFIG);

  peer.on("open", async () => {
    $("hostStatus").textContent = "Đang chờ người chơi";
    await drawQR(url);
  });

  peer.on("error", (err) => {
    console.error("Peer error:", err);
    if (err.type === "unavailable-id") {
      // Trùng mã → thử mã khác
      $("hostStatus").textContent = "Mã trùng, đang tạo mã mới...";
      setTimeout(() => $("btnCreate").click(), 300);
    } else {
      $("hostStatus").textContent = "❌ Lỗi: " + err.type;
    }
  });

  peer.on("connection", (c) => {
    conn = c;
    $("hostStatus").textContent = "Có người kết nối, đang thiết lập";
    setupConnection();
  });
};

$("btnCopyLink").onclick = (e) => {
  if (!window._roomURL) return;
  navigator.clipboard.writeText(window._roomURL).then(() => {
    const old = e.target.textContent;
    e.target.textContent = "✅ Đã copy!";
    setTimeout(() => e.target.textContent = old, 1200);
  });
};

/* =========================================================
   GUEST: nhập mã thủ công
========================================================= */
$("btnJoin").onclick = () => {
  $("joinBox").classList.toggle("hidden");
  if (!$("joinBox").classList.contains("hidden")) $("roomInput").focus();
};

$("btnJoinGo").onclick = () => {
  const code = $("roomInput").value.trim().toUpperCase();
  if (code.length !== 4) return alert("Nhập đủ 4 ký tự!");
  joinRoom(code);
};

$("roomInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") $("btnJoinGo").click();
});
// Tự uppercase khi gõ
$("roomInput").addEventListener("input", (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});

/* =========================================================
   GUEST: auto-join từ URL ?r=XXXX
========================================================= */
const params = new URLSearchParams(location.search);
const autoRoom = params.get("r");
if (autoRoom) {
  setTimeout(() => joinRoom(autoRoom.toUpperCase()), 100);
}

function joinRoom(code) {
  role = "guest";
  menuEl.classList.add("hidden");
  guestEl.classList.remove("hidden");
  $("guestStatus").textContent = "Đang kết nối tới phòng " + code;

  peer = new Peer(PEER_CONFIG);   // Guest dùng ID random

  peer.on("open", () => {
    $("guestStatus").textContent = "Đang tìm Host";
    conn = peer.connect(peerIdFromCode(code), {
      reliable: false,          // UDP-like cho game realtime
      serialization: "json"
    });
    setupConnection();
  });

  peer.on("error", (err) => {
    console.error("Peer error:", err);
    if (err.type === "peer-unavailable") {
      $("guestStatus").textContent = "❌ Không tìm thấy phòng " + code;
    } else {
      $("guestStatus").textContent = "❌ Lỗi: " + err.type;
    }
  });

  // Nếu không kết nối được sau 10s, báo lỗi
  setTimeout(() => {
    if (!game.running && role === "guest") {
      $("guestStatus").textContent = "❌ Hết thời gian kết nối. Kiểm tra lại mã phòng.";
    }
  }, 10000);
}

/* =========================================================
   SETUP CONNECTION (dùng chung cho cả 2)
========================================================= */
function setupConnection() {
  conn.on("open", () => {
    log("✅ Đã kết nối P2P!");
    startGame();
  });

  conn.on("data", (data) => {
    try { onNet(data); } catch(_) {}
  });

  conn.on("close", () => {
    statusEl.textContent = "🔌 Đã ngắt kết nối";
    game.running = false;
  });

  conn.on("error", (err) => {
    console.error("Conn error:", err);
    statusEl.textContent = "❌ Lỗi kết nối";
  });
}

function send(obj) {
  if (conn && conn.open) {
    try { conn.send(obj); } catch(_) {}
  }
}

function log(msg) { statusEl.textContent = msg; console.log("[PP]", msg); }

/* =========================================================
   GAME LOGIC
========================================================= */
const W = canvas.width, H = canvas.height;
const PADDLE_W = 12, PADDLE_H = 90, BALL_R = 9;
const PADDLE_SPEED = 480;
const BALL_SPEED_INIT = 320;
const WIN_SCORE = 7;

const game = {
  running: false,
  left:  { y: (H - PADDLE_H) / 2, dy: 0 },
  right: { y: (H - PADDLE_H) / 2, dy: 0 },
  ball:  { x: W/2, y: H/2, vx: BALL_SPEED_INIT, vy: 120 },
  scoreL: 0, scoreR: 0
};

function startGame() {
  if (game.running) return;
  game.running = true;
  menuEl.classList.add("hidden");
  hostEl.classList.add("hidden");
  guestEl.classList.add("hidden");
  gameEl.classList.remove("hidden");

  if (role === "host") resetBall(Math.random() < 0.5 ? -1 : 1);

  statusEl.textContent = role === "host"
    ? "Bạn là PADDLE TRÁI 👈 (W/S hoặc ↑/↓ hoặc chạm)"
    : "Bạn là PADDLE PHẢI 👉 (W/S hoặc ↑/↓ hoặc chạm)";

  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function resetBall(dir = 1) {
  game.ball.x = W / 2;
  game.ball.y = H / 2;
  const angle = (Math.random() - 0.5) * Math.PI / 3;
  game.ball.vx = Math.cos(angle) * BALL_SPEED_INIT * dir;
  game.ball.vy = Math.sin(angle) * BALL_SPEED_INIT;
}

/* ---- INPUT ---- */
const MY_KEYS = new Set();
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","w","s"].includes(k)) {
    e.preventDefault(); MY_KEYS.add(k); sendInput();
  }
});
window.addEventListener("keyup", e => {
  MY_KEYS.delete(e.key.toLowerCase()); sendInput();
});

let pointerActive = false, pointerTargetY = null;
function canvasY(ev) {
  const r = canvas.getBoundingClientRect();
  const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
  return (cy - r.top) * (H / r.height);
}
["touchstart","touchmove","mousedown","mousemove"].forEach(name => {
  canvas.addEventListener(name, e => {
    if (name === "mousemove" && e.buttons !== 1) return;
    if (name === "touchstart" || name === "mousedown") pointerActive = true;
    if (!pointerActive) return;
    e.preventDefault();
    pointerTargetY = canvasY(e);
    sendInput();
  }, { passive: false });
});
["touchend","touchcancel","mouseup","mouseleave"].forEach(name => {
  canvas.addEventListener(name, () => { pointerActive = false; });
});

function sendInput() {
  if (role !== "guest") return;
  let dir = 0;
  if (MY_KEYS.has("arrowup") || MY_KEYS.has("w")) dir--;
  if (MY_KEYS.has("arrowdown") || MY_KEYS.has("s")) dir++;
  if (pointerTargetY !== null) {
    const c = game.right.y + PADDLE_H / 2;
    dir = Math.abs(pointerTargetY - c) > 6 ? (pointerTargetY > c ? 1 : -1) : 0;
  }
  send({ t: "i", d: dir });
  game.right.dy = dir * PADDLE_SPEED;
}

/* ---- NET ---- */
function onNet(m) {
  if (m.t === "i" && role === "host") {
    game.right.dy = m.d * PADDLE_SPEED;
  } else if (m.t === "s" && role === "guest") {
    game.ball.x = m.bx; game.ball.y = m.by;
    game.left.y = m.ly; game.left.dy = m.ldy;
    game.right.y = m.ry;
    game.scoreL = m.sl; game.scoreR = m.sr;
    scoreLeftEl.textContent = m.sl;
    scoreRightEl.textContent = m.sr;
  }
}

/* ---- LOOP ---- */
let lastTime = performance.now();
let netAcc = 0;
function loop(now) {
  if (!game.running) return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (role === "host") {
    updateHost(dt);
    netAcc += dt;
    if (netAcc > 1/30) {
      send({
        t: "s",
        bx: game.ball.x, by: game.ball.y,
        ly: game.left.y, ldy: game.left.dy,
        ry: game.right.y,
        sl: game.scoreL, sr: game.scoreR
      });
      netAcc = 0;
    }
  } else {
    game.right.y = clamp(game.right.y + game.right.dy * dt, 0, H - PADDLE_H);
  }
  render();
  requestAnimationFrame(loop);
}

function updateHost(dt) {
  let dir = 0;
  if (MY_KEYS.has("arrowup") || MY_KEYS.has("w")) dir--;
  if (MY_KEYS.has("arrowdown") || MY_KEYS.has("s")) dir++;
  if (pointerTargetY !== null) {
    const c = game.left.y + PADDLE_H / 2;
    dir = Math.abs(pointerTargetY - c) > 6 ? (pointerTargetY > c ? 1 : -1) : 0;
  }
  game.left.dy = dir * PADDLE_SPEED;
  game.left.y  = clamp(game.left.y  + game.left.dy  * dt, 0, H - PADDLE_H);
  game.right.y = clamp(game.right.y + game.right.dy * dt, 0, H - PADDLE_H);

  const b = game.ball;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy = Math.abs(b.vy); }
  if (b.y + BALL_R > H) { b.y = H - BALL_R; b.vy = -Math.abs(b.vy); }

  if (b.x - BALL_R < PADDLE_W && b.vx < 0 &&
      b.y > game.left.y && b.y < game.left.y + PADDLE_H) {
    b.x = PADDLE_W + BALL_R; bounce(game.left, 1);
  }
  if (b.x + BALL_R > W - PADDLE_W && b.vx > 0 &&
      b.y > game.right.y && b.y < game.right.y + PADDLE_H) {
    b.x = W - PADDLE_W - BALL_R; bounce(game.right, -1);
  }

  if (b.x - BALL_R < 0) { game.scoreR++; checkWin(); resetBall(1); }
  else if (b.x + BALL_R > W) { game.scoreL++; checkWin(); resetBall(-1); }

  scoreLeftEl.textContent = game.scoreL;
  scoreRightEl.textContent = game.scoreR;
}

function bounce(pad, dirX) {
  const b = game.ball;
  const c = pad.y + PADDLE_H / 2;
  const rel = (b.y - c) / (PADDLE_H / 2);
  const ang = rel * (Math.PI / 3.5);
  const sp = Math.min(Math.hypot(b.vx, b.vy) * 1.06, 900);
  b.vx = Math.cos(ang) * sp * dirX;
  b.vy = Math.sin(ang) * sp;
}

function checkWin() {
  if (game.scoreL >= WIN_SCORE || game.scoreR >= WIN_SCORE) {
    const who = game.scoreL >= WIN_SCORE ? "TRÁI (Host)" : "PHẢI (Guest)";
    setTimeout(() => {
      alert("🏆 " + who + " thắng!");
      game.scoreL = game.scoreR = 0;
      scoreLeftEl.textContent = scoreRightEl.textContent = "0";
      resetBall(Math.random() < 0.5 ? -1 : 1);
    }, 40);
  }
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function render() {
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 14]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  const gL = ctx.createLinearGradient(0, 0, PADDLE_W, 0);
  gL.addColorStop(0, "#38bdf8"); gL.addColorStop(1, "#0ea5e9");
  ctx.fillStyle = gL;
  roundRect(0, game.left.y, PADDLE_W, PADDLE_H, 6);

  const gR = ctx.createLinearGradient(W - PADDLE_W, 0, W, 0);
  gR.addColorStop(0, "#8b5cf6"); gR.addColorStop(1, "#a78bfa");
  ctx.fillStyle = gR;
  roundRect(W - PADDLE_W, game.right.y, PADDLE_W, PADDLE_H, 6);

  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 22;
  ctx.fillStyle = "#facc15";
  ctx.beginPath(); ctx.arc(game.ball.x, game.ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W, H);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath(); ctx.fill();
}
render();
</script>
</body>
</html>
