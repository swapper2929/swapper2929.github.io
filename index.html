<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #0d0d0f;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 90, 40, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 50% 120%, rgba(60, 40, 90, 0.12), transparent);
            color: #e8e6e3;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .game-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header .eyebrow {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #8a7d5c;
            margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.4rem;
            letter-spacing: -0.5px;
            line-height: 1.1;
            color: #f5f2ea;
            margin-bottom: 8px;
        }
        .header h1 em {
            font-style: italic;
            font-weight: 500;
            color: #c9a961;
        }
        .header .subtitle {
            font-size: 13px;
            font-weight: 400;
            color: #6b6b6b;
            letter-spacing: 0.3px;
        }

        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 32px;
        }

        .wheel-wrapper::before {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            border: 1px solid rgba(201, 169, 97, 0.15);
            pointer-events: none;
        }
        .wheel-wrapper::after {
            content: '';
            position: absolute;
            inset: -32px;
            border-radius: 50%;
            border: 1px solid rgba(201, 169, 97, 0.06);
            pointer-events: none;
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow:
                0 0 0 1px rgba(201, 169, 97, 0.3),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 100px rgba(201, 169, 97, 0.08);
            will-change: transform;
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 26px;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }
        .pointer svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .spin-btn {
            width: 100%;
            max-width: 320px;
            padding: 20px 32px;
            background: #f5f2ea;
            color: #0d0d0f;
            border: none;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-bottom: 28px;
        }
        .spin-btn:hover:not(:disabled) {
            background: #ffffff;
            transform: translateY(-1px);
        }
        .spin-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .spin-btn:disabled {
            background: #2a2a2e;
            color: #555558;
            cursor: not-allowed;
        }

        .result-area {
            width: 100%;
            max-width: 320px;
            padding: 20px 24px;
            background: rgba(20, 20, 24, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .result-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin-bottom: 10px;
        }
        .result-number {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 3.6rem;
            line-height: 1;
            color: #f5f2ea;
            letter-spacing: -1px;
            transition: color 0.3s, font-size 0.3s;
        }
        .result-number.jackpot-text {
            font-family: 'Inter', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #c9a961;
            line-height: 1.3;
        }
        .message {
            font-size: 12px;
            color: #6b6b6b;
            margin-top: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            min-height: 1.5em;
            transition: color 0.3s;
        }

        .note {
            margin-top: 20px;
            font-size: 11px;
            color: #4a4a50;
            letter-spacing: 0.5px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .note .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #c9a961;
            opacity: 0.5;
        }
        .note .pity {
            color: #c9a961;
            font-weight: 500;
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .flash {
            position: fixed;
            inset: 0;
            background: #c9a961;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            mix-blend-mode: overlay;
        }
        .flash.active {
            animation: flashAnim 0.5s ease-out;
        }
        @keyframes flashAnim {
            0% { opacity: 0; }
            20% { opacity: 0.4; }
            100% { opacity: 0; }
        }

        @media (max-width: 400px) {
            .wheel-wrapper {
                width: 300px;
                height: 300px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .result-number {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>
    <div class="flash" id="flash"></div>

    <div class="game-container">
        <div class="header">
            <div class="eyebrow">Giải thưởng đặc biệt</div>
            <h1>Vòng Quay <em>May Mắn</em></h1>
            <div class="subtitle">Quay để nhận phần thưởng của bạn</div>
        </div>

        <div class="wheel-wrapper">
            <div class="pointer">
                <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 24 L2 4 Q13 0 24 4 Z" fill="#f5f2ea" stroke="#0d0d0f" stroke-width="1"/>
                    <circle cx="13" cy="6" r="2.5" fill="#c9a961"/>
                </svg>
            </div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>

        <button class="spin-btn" id="spinButton">Quay</button>

        <div class="result-area">
            <div class="result-label">Kết quả</div>
            <div class="result-number" id="resultDisplay">0</div>
            <div class="message" id="message">Nhấn Quay để bắt đầu</div>
        </div>

        <div class="note">
            <span>Ô JACKPOT</span>
            <span class="dot"></span>
            <span>Phần thưởng: 1 bé femboy</span>
            <span class="dot"></span>
            <span class="pity" id="pityCounter">Pity: 0/3</span>
        </div>
    </div>

<script>
    (function() {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinButton');
        const resultDisplay = document.getElementById('resultDisplay');
        const messageEl = document.getElementById('message');
        const flash = document.getElementById('flash');
        const pityCounter = document.getElementById('pityCounter');

        const NUM_SECTORS = 10;
        const SECTOR_ANGLE = (Math.PI * 2) / NUM_SECTORS;
        const RADIUS = 235;
        const CENTER = 250;
        const JACKPOT_INDEX = 9;
        const JACKPOT_CHANCE = 0.30; // 30%
        const PITY_THRESHOLD = 3;    // Sau 3 lần không trúng → lần 4 chắc chắn trúng

        const COLORS = [
            '#1f1f24', '#26262c', '#2d2d34', '#34343c', '#3b3b44',
            '#42424c', '#494954', '#50505c', '#575764', '#8b1e3f'
        ];

        const TEXT_COLORS = [
            '#c9a961', '#c9a961', '#c9a961', '#c9a961', '#c9a961',
            '#c9a961', '#c9a961', '#c9a961', '#c9a961', '#f5f2ea'
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let spinPhase = 'idle';
        let animationFrameId = null;
        let lastDrawTime = 0;

        let animStartTime = 0;
        let animStartAngle = 0;
        let animTotalRotation = 0;
        let animDuration = 0;

        // Pity system
        let pityCounterValue = 0;

        // Lưu trữ các sector đã vẽ để tránh tính toán lại
        let wheelDirty = true;

        // ---------- VẼ ----------
        function drawWheel(angle) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < NUM_SECTORS; i++) {
                const startAngle = i * SECTOR_ANGLE + angle;
                const endAngle = startAngle + SECTOR_ANGLE;

                ctx.beginPath();
                ctx.moveTo(CENTER, CENTER);
                ctx.arc(CENTER, CENTER, RADIUS, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = COLORS[i];
                ctx.fill();

                ctx.strokeStyle = 'rgba(201, 169, 97, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(startAngle + SECTOR_ANGLE / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (i === JACKPOT_INDEX) {
                    ctx.font = '600 22px Inter, sans-serif';
                    ctx.fillStyle = '#f5f2ea';
                    ctx.fillText('JACKPOT', 155, -10);
                    ctx.font = '400 13px Inter, sans-serif';
                    ctx.fillStyle = '#c9a961';
                    ctx.fillText('1 bé femboy', 155, 14);
                } else {
                    ctx.font = '300 56px "Playfair Display", serif';
                    ctx.fillStyle = TEXT_COLORS[i];
                    ctx.fillText(i.toString(), 160, 0);
                }
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(201, 169, 97, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, RADIUS - 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(201, 169, 97, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, 44, 0, Math.PI * 2);
            ctx.fillStyle = '#141418';
            ctx.fill();
            ctx.strokeStyle = 'rgba(201, 169, 97, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(CENTER, CENTER, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#c9a961';
            ctx.fill();
        }

        // ---------- LOGIC ----------
        function normalizeAngle(a) {
            return ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        }

        function getIndexAtPointer(angle) {
            const pointerAngle = -Math.PI / 2;
            let raw = normalizeAngle(pointerAngle - angle);
            return Math.floor(raw / SECTOR_ANGLE) % NUM_SECTORS;
        }

        function getAngleForIndex(index) {
            const pointerAngle = -Math.PI / 2;
            let targetAngle = pointerAngle - index * SECTOR_ANGLE - SECTOR_ANGLE / 2;
            return normalizeAngle(targetAngle);
        }

        // Quay nhẹ: chọn hướng gần nhất, thêm tối thiểu minRounds vòng
        function calculateSmoothRotation(startAngle, targetAngle, minRounds = 1) {
            const startNorm = normalizeAngle(startAngle);
            const targetNorm = normalizeAngle(targetAngle);

            let deltaCW = targetNorm - startNorm;
            if (deltaCW < 0) deltaCW += Math.PI * 2;

            let deltaCCW = targetNorm - startNorm;
            if (deltaCCW > 0) deltaCCW -= Math.PI * 2;

            const absCW = Math.abs(deltaCW);
            const absCCW = Math.abs(deltaCCW);

            let delta, direction;
            if (absCW <= absCCW) {
                direction = 1;
                delta = deltaCW;
                if (Math.abs(delta) < minRounds * Math.PI * 2) {
                    const extra = Math.ceil((minRounds * Math.PI * 2 - Math.abs(delta)) / (Math.PI * 2));
                    delta += extra * Math.PI * 2;
                }
            } else {
                direction = -1;
                delta = deltaCCW;
                if (Math.abs(delta) < minRounds * Math.PI * 2) {
                    const extra = Math.ceil((minRounds * Math.PI * 2 - Math.abs(delta)) / (Math.PI * 2));
                    delta -= extra * Math.PI * 2;
                }
            }

            return { totalRotation: delta, direction };
        }

        // Cập nhật pity counter UI
        function updatePityUI() {
            pityCounter.textContent = `Pity: ${pityCounterValue}/${PITY_THRESHOLD}`;
        }

        // ---------- QUAY ----------
        function startSpin() {
            if (isSpinning) return;

            isSpinning = true;
            spinPhase = 'randomSpin';
            spinBtn.disabled = true;
            messageEl.textContent = 'Đang quay...';
            messageEl.style.color = '#c9a961';
            resultDisplay.classList.remove('jackpot-text');

            animStartAngle = currentAngle;

            // Quyết định đích đến
            let targetIndex;
            let isPityTriggered = false;

            if (pityCounterValue >= PITY_THRESHOLD) {
                // Pity: chắc chắn trúng jackpot
                targetIndex = JACKPOT_INDEX;
                isPityTriggered = true;
            } else if (Math.random() < JACKPOT_CHANCE) {
                targetIndex = JACKPOT_INDEX;
            } else {
                // Random 0-8 (không bao gồm jackpot)
                targetIndex = Math.floor(Math.random() * 9);
            }

            // Lưu lại để xử lý sau khi quay xong
            window._lastTargetIndex = targetIndex;
            window._isPityTriggered = isPityTriggered;

            const targetAngle = getAngleForIndex(targetIndex);

            // Quay nhẹ: 1-2 vòng
            const minRounds = 1 + Math.floor(Math.random() * 2);
            const result = calculateSmoothRotation(animStartAngle, targetAngle, minRounds);
            animTotalRotation = result.totalRotation;

            animDuration = 1800 + Math.min(600, Math.abs(animTotalRotation) / (Math.PI * 2) * 150);
            animStartTime = performance.now();
            lastDrawTime = 0;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(spinAnimation);
        }

        function spinAnimation(now) {
            if (spinPhase !== 'randomSpin') return;

            const elapsed = now - animStartTime;
            const progress = Math.min(elapsed / animDuration, 1);

            const easeOut = 1 - Math.pow(1 - progress, 4);

            const angle = animStartAngle + animTotalRotation * easeOut;
            currentAngle = angle;

            // Chỉ vẽ khi cần (giới hạn ~60fps nhưng bỏ qua frame nếu không thay đổi nhiều)
            if (now - lastDrawTime > 12) {
                drawWheel(currentAngle);
                lastDrawTime = now;
            }

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(spinAnimation);
            } else {
                drawWheel(currentAngle);
                handleSpinEnd();
            }
        }

        function handleSpinEnd() {
            const landedIndex = getIndexAtPointer(currentAngle);
            const isPityTriggered = window._isPityTriggered;

            // NẾU TRÚNG SỐ 0 NGAY TỪ ĐẦU → DỪNG LUÔN
            if (landedIndex === 0) {
                // Reset pity? Không, pity chỉ reset khi trúng jackpot
                // Nhưng số 0 cũng là kết quả cuối → không tăng pity vì không phải jackpot
                // Thực ra pity counter chỉ tăng khi KHÔNG trúng jackpot
                // Ở đây landed 0 → không trúng jackpot → tăng pity
                if (pityCounterValue < PITY_THRESHOLD) {
                    pityCounterValue++;
                    updatePityUI();
                }

                resultDisplay.textContent = '0';
                messageEl.textContent = 'Chúc mừng! Bạn quay trúng số 0!';
                messageEl.style.color = '#c9a961';

                spinPhase = 'idle';
                isSpinning = false;
                spinBtn.disabled = false;

                fireConfetti(40);
                return;
            }

            // Nếu trúng jackpot
            if (landedIndex === JACKPOT_INDEX) {
                resultDisplay.textContent = '1 BÉ FEMBOY';
                resultDisplay.classList.add('jackpot-text');
                if (isPityTriggered) {
                    messageEl.textContent = '🎉 PITY! Chúc mừng bạn đã trúng JACKPOT!';
                } else {
                    messageEl.textContent = 'Chúc mừng! Bạn đã trúng JACKPOT!';
                }
                messageEl.style.color = '#c9a961';
                triggerFlash();
                fireConfetti(100);

                // Reset pity vì đã trúng jackpot
                pityCounterValue = 0;
                updatePityUI();

                spinPhase = 'jackpotCelebration';

                setTimeout(() => {
                    if (spinPhase === 'jackpotCelebration') {
                        startReturnToZero();
                    }
                }, 2400);
            } else {
                // Các số 1-8 → không trúng jackpot → tăng pity
                if (pityCounterValue < PITY_THRESHOLD) {
                    pityCounterValue++;
                    updatePityUI();
                }

                resultDisplay.textContent = landedIndex;
                messageEl.textContent = `Dừng ở số ${landedIndex}...`;
                messageEl.style.color = '#6b6b6b';
                spinPhase = 'pauseAtRandom';

                setTimeout(() => {
                    if (spinPhase === 'pauseAtRandom') {
                        startReturnToZero();
                    }
                }, 1200);
            }
        }

        function startReturnToZero() {
            spinPhase = 'returnToZero';
            messageEl.textContent = 'Về 0 thôi...';
            messageEl.style.color = '#6b6b6b';
            resultDisplay.classList.remove('jackpot-text');

            animStartAngle = currentAngle;
            const targetAngle = getAngleForIndex(0);

            const minRounds = 1 + Math.floor(Math.random() * 2);
            const result = calculateSmoothRotation(animStartAngle, targetAngle, minRounds);
            animTotalRotation = result.totalRotation;

            animDuration = 1600 + Math.random() * 500;
            animStartTime = performance.now();
            lastDrawTime = 0;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(returnAnimation);
        }

        function returnAnimation(now) {
            if (spinPhase !== 'returnToZero') return;

            const elapsed = now - animStartTime;
            const progress = Math.min(elapsed / animDuration, 1);

            let eased;
            if (progress < 0.5) {
                eased = 8 * progress * progress * progress * progress;
            } else {
                eased = 1 - Math.pow(-2 * progress + 2, 4) / 2;
            }

            const angle = animStartAngle + animTotalRotation * eased;
            currentAngle = angle;

            if (now - lastDrawTime > 12) {
                drawWheel(currentAngle);
                lastDrawTime = now;
            }

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(returnAnimation);
            } else {
                currentAngle = getAngleForIndex(0);
                drawWheel(currentAngle);

                spinPhase = 'idle';
                isSpinning = false;
                spinBtn.disabled = false;

                resultDisplay.textContent = '0';
                resultDisplay.classList.remove('jackpot-text');
                messageEl.textContent = 'Kết quả cuối cùng: 0';
                messageEl.style.color = '#6b6b6b';

                fireConfetti(30);
            }
        }

        function triggerFlash() {
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 500);
        }

        // ---------- CONFETTI (TỐI ƯU) ----------
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfettiCanvas();

        // Debounce resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeConfettiCanvas, 200);
        });

        const CONFETTI_COLORS = [
            '#c9a961', '#e8d5a0', '#f5f2ea', '#d4b87a'
        ];

        function fireConfetti(count) {
            const w = confettiCanvas.width;
            const h = confettiCanvas.height;

            for (let i = 0; i < count; i++) {
                confettiParticles.push({
                    x: w / 2 + (Math.random() - 0.5) * w * 0.5,
                    y: h * 0.45 + (Math.random() - 0.5) * 80,
                    vx: (Math.random() - 0.5) * 12,
                    vy: -(Math.random() * 10 + 4),
                    size: Math.random() * 6 + 4,
                    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    gravity: 0.28,
                    opacity: 1,
                    shape: Math.random() > 0.6 ? 'ribbon' : 'rect',
                    life: 0,
                    sway: Math.random() * 0.4 + 0.3,
                    swayPhase: Math.random() * Math.PI * 2
                });
            }

            if (!confettiAnimationId) {
                confettiAnimationId = requestAnimationFrame(updateConfetti);
            }
        }

        function updateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];

                p.vy += p.gravity;
                p.vx *= 0.985;
                p.swayPhase += 0.05;
                p.x += p.vx + Math.sin(p.swayPhase) * p.sway;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.life++;

                if (p.life > 80) {
                    p.opacity -= 0.02;
                }

                if (p.opacity <= 0 || p.y > confettiCanvas.height + 50) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation);
                confettiCtx.globalAlpha = p.opacity;
                confettiCtx.fillStyle = p.color;

                if (p.shape === 'ribbon') {
                    confettiCtx.fillRect(-p.size / 2, -p.size / 6, p.size, p.size / 3);
                } else {
                    confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                }

                confettiCtx.restore();
            }

            if (confettiParticles.length > 0) {
                confettiAnimationId = requestAnimationFrame(updateConfetti);
            } else {
                confettiAnimationId = null;
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        // ---------- INIT ----------
        function initWheel() {
            currentAngle = getAngleForIndex(0);
            drawWheel(currentAngle);

            resultDisplay.textContent = '0';
            messageEl.textContent = 'Nhấn Quay để bắt đầu';
            spinPhase = 'idle';
            isSpinning = false;
            spinBtn.disabled = false;

            pityCounterValue = 0;
            updatePityUI();
        }

        spinBtn.addEventListener('click', startSpin);
        initWheel();

    })();
</script>
</body>
</html>
