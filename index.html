<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pháp Luật - La Hiên Học</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#20243a; --purple:#46178f; --blue:#1368ce; --red:#e21b3c; --yellow:#d89e00; --green:#26890c; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 15% 15%, #6335a5 0, transparent 35%),
                linear-gradient(135deg, #250b55 0%, #32106b 55%, #160b35 100%);
    min-height: 100vh; display:flex; justify-content:center; align-items:center;
    padding:18px; color:var(--ink);
  }
  .container {
    background:#f7f7fb; border-radius:22px; box-shadow:0 22px 70px #09021d88;
    width:100%; max-width:900px; padding:26px; position:relative; overflow:hidden;
    border:1px solid #ffffff55;
  }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; color:#56566b; font-weight:800; }
  .progress-text { font-size:15px; background:#ece9f7; padding:9px 14px; border-radius:999px; }
  .timer-ring { position:relative; width:64px; height:64px; flex:none; }
  .timer-ring svg { transform:rotate(-90deg); width:64px; height:64px; }
  .timer-ring circle { fill:none; stroke-width:6; }
  .timer-bg { stroke:#e4e1ec; }
  .timer-fg { stroke:#46178f; stroke-linecap:round; transition:stroke-dashoffset .1s linear,stroke .2s; }
  .timer-num { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; font-weight:900; font-size:21px; color:#46178f; }
  .timer-num.danger { color:#e21b3c; }
  .progress-bar { height:8px; background:#e8e5ef; border-radius:99px; overflow:hidden; margin-bottom:22px; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#20b2aa,#5b35bd); width:0%; transition:width .3s; }
  .question { background:#fff; border-radius:16px; padding:26px 22px; font-size:clamp(19px,3vw,27px); line-height:1.35; color:#24243a; font-weight:850; text-align:center; margin-bottom:18px; min-height:112px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 12px #1b124012; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .answer { min-height:94px; padding:18px; border:0; border-radius:13px; color:white; cursor:pointer; font-size:clamp(14px,2vw,17px); font-weight:750; text-align:left; line-height:1.35; box-shadow:0 5px 0 #0002; transition:transform .12s,filter .12s; }
  .answer:nth-child(4n+1) { background:#e21b3c; }
  .answer:nth-child(4n+2) { background:#1368ce; }
  .answer:nth-child(4n+3) { background:#d89e00; }
  .answer:nth-child(4n+4) { background:#26890c; }
  .answer:hover { filter:brightness(1.08); transform:translateY(-2px); }
  .answer.correct { background:#16833b !important; outline:4px solid #9be7b0; }
  .answer.wrong { background:#9d1830 !important; outline:4px solid #ff9aaa; }
  .answer.disabled { pointer-events:none; opacity:.78; }
  .feedback { margin-top:16px; font-size:16px; font-weight:850; text-align:center; min-height:24px; }
  .feedback.ok { color:#16833b; } .feedback.no { color:#c51b36; }
  .result { text-align:center; padding:20px 0; }
  .result h1 { font-size:clamp(27px,5vw,38px); color:#46178f; margin-bottom:10px; }
  .result .score { font-size:clamp(44px,9vw,64px); font-weight:950; color:#46178f; margin:8px 0; }
  .result .detail { color:#5b5b70; font-size:16px; margin-bottom:18px; }
  .award { background:linear-gradient(135deg,#fff1b8,#ffe08a); border:2px solid #f1c44d; border-radius:16px; padding:16px; margin:12px auto 20px; max-width:540px; color:#654500; }
  .award .medal { font-size:48px; line-height:1.2; }
  .review { text-align:left; margin:22px auto; max-width:760px; }
  .review h2 { color:#30205c; font-size:21px; margin-bottom:12px; }
  .review-item { background:#fff; border-left:5px solid #e21b3c; border-radius:10px; padding:14px 16px; margin:10px 0; box-shadow:0 2px 8px #17102a0d; }
  .review-item .rq { font-weight:800; margin-bottom:8px; line-height:1.4; }
  .review-item .your { color:#bd2339; margin:4px 0; }
  .review-item .right { color:#16833b; font-weight:800; margin-top:4px; }
  .review-empty { background:#e5f7e9; border-radius:12px; padding:16px; color:#176b31; font-weight:750; }
  .btn { background:linear-gradient(135deg,#46178f,#7044c4); color:#fff; border:0; padding:14px 30px; border-radius:12px; font-size:16px; font-weight:850; cursor:pointer; box-shadow:0 5px 0 #2b0c5c; }
  .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .hidden { display:none; }
  @media(max-width:600px) {
    body { padding:10px; align-items:flex-start; }
    .container { padding:15px; margin:10px 0; }
    .answers { grid-template-columns:1fr; gap:9px; }
    .answer { min-height:64px; padding:14px; }
    .question { min-height:100px; padding:20px 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Màn hình quiz -->
  <div id="quizScreen">
    <div class="topbar">
      <div class="progress-text" id="progressText">Câu 1/48</div>
      <div class="timer-ring">
        <svg width="60" height="60">
          <circle class="timer-bg" cx="30" cy="30" r="26"></circle>
          <circle class="timer-fg" id="timerFg" cx="30" cy="30" r="26"></circle>
        </svg>
        <div class="timer-num" id="timerNum">6</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question" id="questionText"></div>
    <div class="answers" id="answersBox"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- Màn hình kết quả -->
  <div id="resultScreen" class="result hidden">
    <h1>🏆 BẢNG VINH DANH</h1>
    <div class="award">
      <div class="medal" id="awardMedal">🏅</div>
      <div id="awardTitle" style="font-size:22px;font-weight:900">Người hoàn thành thử thách</div>
      <div id="awardMessage" style="margin-top:5px">Bạn đã hoàn thành bộ câu hỏi!</div>
    </div>
    <div class="score" id="finalScore">0/0</div>
    <div class="detail" id="finalDetail"></div>
    <div class="review" id="reviewBox">
      <h2>📝 Những câu trả lời sai và đáp án đúng</h2>
      <div id="wrongList"></div>
    </div>
    <button class="btn" onclick="startQuiz()">🔄 Làm lại</button>
  </div>
</div>

<script>

  { q: "Hiến pháp 2013: Công dân bao nhiêu tuổi có quyền ứng cử vào Quốc hội, HĐND?", a: ["Đủ 16 tuổi", "Đủ 18 tuổi", "Đủ 20 tuổi", "Đủ 21 tuổi"], c: 3 },

  // II. HÌNH SỰ

  { q: "Luật NVQS 2015: Đối tượng nào được miễn đăng ký NVQS?", a: ["Người khuyết tật", "Người bệnh hiểm nghèo", "Người bệnh tâm thần/mãn tính", "Tất cả các đối tượng trên"], c: 3 },
  { q: "Luật NVQS 2015: Công dân CĐ/ĐH tạm hoãn gọi nhập ngũ đến hết bao nhiêu tuổi?", a: ["25 tuổi", "27 tuổi", "30 tuổi", "35 tuổi"], c: 1 },

  { q: "Luật XLVPHC 2012: Ban đêm tính từ mấy giờ đến mấy giờ?", a: ["18h - 6h", "21h - 7h", "22h - 7h", "22h - 6h"], c: 3 },
  { q: "Luật XLVPHC 2012: Đối tượng bị giáo dục tại xã, phường, thị trấn?", a: ["13-<16 tuổi, tội rất nghiêm trọng cố ý", "13-<17 tuổi, tội rất nghiêm trọng cố ý", "14-<18 tuổi, tội rất nghiêm trọng cố ý", "12-<14 tuổi, tội rất nghiêm trọng cố ý"], c: 3 },
  { q: "Luật XLVPHC 2012: Hình thức xử phạt chính gồm?", a: ["Cảnh cáo, Phạt tiền", "Cảnh cáo, Phạt tiền, Tịch thu tang vật", "Cảnh cáo, Phạt tiền, Đình chỉ hoạt động", "Cảnh cáo, Tước giấy phép, Đình chỉ"], c: 0 },
  { q: "Luật XLVPHC 2012: Người từ đủ bao nhiêu tuổi bị xử phạt VPHC về mọi vi phạm?", a: ["14 tuổi", "16 tuổi", "15 tuổi", "18 tuổi"], c: 1 },

  { q: "Phương tiện giao thông đường bộ gồm những loại nào?", a: ["Cơ giới đường bộ", "Thô sơ, xe máy chuyên dùng, xe tương tự", "Cả hai ý trên", "Không đáp án nào"], c: 2 },
  { q: "Sản xuất, mua bán trái phép biển số xe có bị nghiêm cấm không?", a: ["Không bị nghiêm cấm", "Bị nghiêm cấm", "Tùy trường hợp", "Không quy định"], c: 1 },
  { q: "Người lái xe giảm tốc, tín hiệu rẽ phải, sát phải trong trường hợp nào?", a: ["Xe trước có tín hiệu vượt", "Xe ngược chiều", "Xe sau xin vượt đủ an toàn", "Xe sau có tín hiệu vượt phải"], c: 2 },
  { q: "Người được chở trên mô tô, gắn máy KHÔNG được làm gì?", a: ["Mang, vác vật cồng kềnh", "Bám, kéo, đẩy phương tiện khác", "Dùng tay cầm điện thoại", "Cả A và B"], c: 3 },
  { q: "Xe mô tô được chở tối đa 2 người trong trường hợp nào?", a: ["Cấp cứu, áp giải người vi phạm", "Người uống rượu, có ma túy", "Trẻ dưới 12 tuổi, già yếu, khuyết tật", "Cả A và C"], c: 3 },
  { q: "Mô tô đường đôi ≥2 làn (đông dân cư) tốc độ tối đa?", a: ["60 km/h", "50 km/h", "40 km/h", "70 km/h"], c: 0 },
  { q: "Mô tô đường 2 chiều/1 làn (đông dân cư) tốc độ tối đa?", a: ["60 km/h", "50 km/h", "40 km/h", "70 km/h"], c: 1 },
  { q: "Không còi, đèn soi biển số, gương chiếu hậu bị phạt bao nhiêu?", a: ["200-400k", "300-500k", "400-600k", "500-700k"], c: 2 },
  { q: "2 người không đội mũ bảo hiểm khi đi mô tô bị phạt tổng bao nhiêu?", a: ["500.000", "1.000.000", "1.500.000", "2.000.000"], c: 1 },

  // XIV. HỌC ĐƯỜNG
  { q: "Hành hạ, đánh đập, xúc phạm trong cơ sở giáo dục là khái niệm nào?", a: ["Bạo hành trẻ em", "Bạo lực học đường", "Bạo lực gia đình", "Tệ nạn xã hội"], c: 1 },
  { q: "Biết bạn bàn đánh nhau sau giờ học, em nên làm gì?", a: ["Làm ngơ", "Báo giáo viên chủ nhiệm", "Rủ bạn xem đánh nhau", "Đánh lại các bạn"], c: 1 }
];

const TIME_PER_Q = 6;
let current = 0;
let score = 0;
let quizQuestions = [];
let timer = null;
let timeLeft = TIME_PER_Q;
let answered = false;
let wrongAnswers = [];

const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 26;

function shuffleArray(items) {
  // Fisher-Yates shuffle.
  const shuffled = [...items];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function startQuiz() {
  current = 0; score = 0; wrongAnswers = [];
  // Mỗi lượt chơi xáo trộn lại câu hỏi và các lựa chọn.
  quizQuestions = shuffleArray(QUESTIONS).map(question => {
    const shuffledAnswers = shuffleArray(
      question.a.map((answer, originalIndex) => ({
        text: answer,
        isCorrect: originalIndex === question.c
      }))
    );
    return {
      q: question.q,
      a: shuffledAnswers.map(answer => answer.text),
      c: shuffledAnswers.findIndex(answer => answer.isCorrect)
    };
  });
  $('resultScreen').classList.add('hidden');
  $('quizScreen').classList.remove('hidden');
  loadQuestion();
}

function loadQuestion() {
  if (current >= quizQuestions.length) return showResult();
  answered = false;
  const q = quizQuestions[current];

  $('progressText').textContent = `Câu ${current + 1}/${quizQuestions.length}`;
  $('progressFill').style.width = `${(current / quizQuestions.length) * 100}%`;
  $('questionText').textContent = q.q;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';

  const box = $('answersBox');
  box.innerHTML = '';
  q.a.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = `${String.fromCharCode(65 + i)}. ${text}`;
    btn.onclick = () => selectAnswer(i);
    box.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = TIME_PER_Q;
  updateTimerUI();
  timer = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateTimerUI();
      clearInterval(timer);
      if (!answered) selectAnswer(-1);
    } else {
      updateTimerUI();
    }
  }, 100);
}

function updateTimerUI() {
  const num = $('timerNum');
  const fg = $('timerFg');
  const sec = Math.ceil(timeLeft);
  num.textContent = sec;
  const offset = CIRC * (1 - timeLeft / TIME_PER_Q);
  fg.style.strokeDasharray = CIRC;
  fg.style.strokeDashoffset = offset;
  const danger = timeLeft <= 3;
  num.classList.toggle('danger', danger);
  fg.style.stroke = danger ? '#e74c3c' : '#2a5298';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const q = quizQuestions[current];
  const buttons = $('answersBox').children;
  [...buttons].forEach(b => b.classList.add('disabled'));

  if (idx === q.c) {
    score++;
    buttons[idx].classList.add('correct');
    $('feedback').textContent = '✅ Chính xác!';
    $('feedback').className = 'feedback ok';
  } else {
    if (idx >= 0) buttons[idx].classList.add('wrong');
    buttons[q.c].classList.add('correct');
    wrongAnswers.push({
      question: q.q,
      chosen: idx >= 0 ? q.a[idx] : 'Không trả lời (hết 6 giây)',
      correct: q.a[q.c]
    });
    $('feedback').textContent = idx < 0 ? '⏰ Hết giờ! Đáp án đúng đã được đánh dấu.' : '❌ Chưa chính xác! Đáp án đúng đã được đánh dấu.';
    $('feedback').className = 'feedback no';
  }

  setTimeout(() => {
    current++;
    loadQuestion();
  }, 1300);
}

function showResult() {
  clearInterval(timer);
  $('quizScreen').classList.add('hidden');
  $('resultScreen').classList.remove('hidden');

  const pct = Math.round((score / quizQuestions.length) * 100);
  $('finalScore').textContent = `${score}/${quizQuestions.length}`;
  $('finalDetail').textContent = `Đúng ${pct}% · Sai hoặc bỏ qua ${wrongAnswers.length} câu`;

  const medal = pct >= 90 ? '🥇' : pct >= 75 ? '🥈' : pct >= 50 ? '🥉' : '🎖️';
  const title = pct >= 90 ? 'NHÀ VÔ ĐỊCH KIẾN THỨC!' :
                pct >= 75 ? 'THÀNH TÍCH RẤT TỐT!' :
                pct >= 50 ? 'ĐÃ HOÀN THÀNH THỬ THÁCH!' : 'CHIẾN BINH ĐANG TIẾN BỘ!';
  const message = pct >= 90 ? 'Một màn thể hiện xuất sắc. Chiếc cúp này xứng đáng thuộc về bạn!' :
                  pct >= 75 ? 'Kết quả ấn tượng, chỉ còn một chút nữa là chạm đỉnh!' :
                  pct >= 50 ? 'Bạn đã vượt qua bộ câu hỏi. Tiếp tục củng cố kiến thức nhé!' :
                  'Mỗi lượt chơi là một lần học thêm. Xem lại các câu bên dưới rồi thử lại!';
  $('awardMedal').textContent = medal;
  $('awardTitle').textContent = title;
  $('awardMessage').textContent = message;

  const list = $('wrongList');
  list.innerHTML = '';
  if (wrongAnswers.length === 0) {
    list.innerHTML = '<div class="review-empty">🎉 Không có câu sai nào. Hoàn hảo!</div>';
  } else {
    wrongAnswers.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'review-item';

      const question = document.createElement('div');
      question.className = 'rq';
      question.textContent = `${index + 1}. ${item.question}`;

      const chosen = document.createElement('div');
      chosen.className = 'your';
      chosen.textContent = `Bạn chọn: ${item.chosen}`;

      const correct = document.createElement('div');
      correct.className = 'right';
      correct.textContent = `✓ Đáp án đúng: ${item.correct}`;

      card.append(question, chosen, correct);
      list.appendChild(card);
    });
  }
}

startQuiz();
</script>
