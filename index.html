<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    color: #e2e8f0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; gap: 14px;
  }
  h1 {
    font-size: 1.6rem; letter-spacing: 1px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .screen {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 640px; align-items: center;
  }
  .hidden { display: none !important; }
  .btn {
    padding: 12px 24px; border: none; border-radius: 10px;
    background: #334155; color: #f1f5f9; font-size: 1rem;
    font-weight: 600; cursor: pointer;
    transition: transform .15s, background .2s;
    width: 100%; max-width: 340px;
  }
  .btn:hover { background: #475569; transform: translateY(-2px); }
  .btn.primary {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    box-shadow: 0 8px 20px rgba(56,189,248,.3);
  }
  .btn.primary:hover { box-shadow: 0 10px 24px rgba(99,102,241,.5); }
  .btn.ghost { background: transparent; border: 1px solid #334155; }
  textarea {
    width: 100%; min-height: 76px; padding: 10px;
    border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0;
    font-family: ui-monospace, monospace; font-size: .8rem;
    resize: vertical; word-break: break-all;
  }
  .row { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  .row .btn { max-width: none; }
  #joinArea, #hostArea {
    width: 100%; display: flex; flex-direction: column; gap: 10px;
    margin-top: 6px; animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hint { font-size: .78rem; color: #94a3b8; text-align: center; line-height: 1.4; }
  .label { font-size: .8rem; color: #94a3b8; align-self: flex-start; }

  #game { max-width: 100%; }
  canvas {
    width: 100%; max-width: 800px; height: auto;
    background: #020617; border-radius: 12px;
    box-shadow: 0 0 40px rgba(56,189,248,.2);
    border: 2px solid #1e293b; display: block;
  }
  #status { text-align: center; color: #94a3b8; font-size: .9rem; margin-top: 8px; }
  #scoreboard {
    display: flex; justify-content: space-between; width: 100%;
    max-width: 800px; font-size: 1.4rem; font-weight: 700;
    color: #38bdf8; padding: 0 12px;
  }
  #scoreboard span:last-child { color: #a78bfa; }
  @media (max-width: 600px) {
    h1 { font-size: 1.3rem; }
    .btn { padding: 10px 18px; font-size: .95rem; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🏓 Ping Pong Online</h1>

  <!-- ============ MENU ============ -->
  <div id="menu" class="screen">
    <button id="btnCreate" class="btn primary">🎮 Tạo phòng (Host)</button>
    <button id="btnJoin" class="btn">🔗 Tham gia phòng (Guest)</button>

    <div id="hostArea" class="hidden">
      <span class="label">1. Gửi <b>Offer code</b> này cho Guest:</span>
      <textarea id="offerOutput" readonly placeholder="Đang tạo offer..."></textarea>
      <button id="btnCopyOffer" class="btn ghost">📋 Copy Offer</button>
      <span class="label">2. Dán <b>Answer code</b> từ Guest vào đây:</span>
      <textarea id="answerInput" placeholder="Dán Answer code..."></textarea>
      <button id="btnConnect" class="btn primary">🔌 Kết nối</button>
    </div>

    <div id="joinArea" class="hidden">
      <span class="label">1. Dán <b>Offer code</b> từ Host vào đây:</span>
      <textarea id="offerInput" placeholder="Dán Offer code..."></textarea>
      <button id="btnGenAnswer" class="btn primary">✅ Tạo Answer</button>
      <span class="label">2. Gửi <b>Answer code</b> này lại cho Host:</span>
      <textarea id="answerOutput" readonly placeholder="Answer code sẽ hiện ở đây..."></textarea>
      <button id="btnCopyAnswer" class="btn ghost">📋 Copy Answer</button>
    </div>

    <p class="hint">Không cần server – dùng WebRTC + Google STUN<br>
    Trao đổi code qua Zalo/Messenger/Telegram để kết nối.</p>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen hidden">
    <div id="scoreboard">
      <span id="scoreLeft">0</span>
      <span id="scoreRight">0</span>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div id="status">Đang kết nối...</div>
  </div>
</div>

<script>
/* =========================================================
   PWA SW (inline)
========================================================= */
if ("serviceWorker" in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open('pp-v1').then(c =>
          fetch(e.request).then(r => { c.put(e.request, r.clone()); return r; })
            .catch(() => c.match(e.request))
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: "text/javascript" });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

/* =========================================================
   CẤU HÌNH WEBRTC — Google STUN
========================================================= */
const RTC_CONFIG = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    { urls: "stun:stun3.l.google.com:19302" },
    { urls: "stun:stun4.l.google.com:19302" }
  ]
};

/* =========================================================
   DOM
========================================================= */
const $ = id => document.getElementById(id);
const menuEl = $("menu"), gameEl = $("game"), statusEl = $("status");
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const scoreLeftEl = $("scoreLeft"), scoreRightEl = $("scoreRight");

/* =========================================================
   TRẠNG THÁI GAME
========================================================= */
const W = canvas.width, H = canvas.height;
const PADDLE_W = 12, PADDLE_H = 90, BALL_R = 9;
const PADDLE_SPEED = 480;      // px/s
const BALL_SPEED_INIT = 320;   // px/s
const WIN_SCORE = 7;

const game = {
  running: false,
  myRole: null,          // "host" | "guest"
  left:  { y: (H - PADDLE_H) / 2, dy: 0 },
  right: { y: (H - PADDLE_H) / 2, dy: 0 },
  ball:  { x: W/2, y: H/2, vx: BALL_SPEED_INIT, vy: 120 },
  scoreL: 0, scoreR: 0,
  keys: {},
  lastInput: 0
};

/* =========================================================
   WEBRTC
========================================================= */
let pc = null, dataChannel = null;

function createPeer(isHost) {
  pc = new RTCPeerConnection(RTC_CONFIG);

  pc.onconnectionstatechange = () => {
    log("Trạng thái: " + pc.connectionState);
    if (pc.connectionState === "connected") startGame(isHost ? "host" : "guest");
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      statusEl.textContent = "❌ Mất kết nối";
      game.running = false;
    }
  };

  if (isHost) {
    dataChannel = pc.createDataChannel("game");
    setupDataChannel();
  } else {
    pc.ondatachannel = e => { dataChannel = e.channel; setupDataChannel(); };
  }
  return pc;
}

function setupDataChannel() {
  dataChannel.onopen = () => log("✅ DataChannel mở");
  dataChannel.onmessage = e => {
    try { handleNetMessage(JSON.parse(e.data)); } catch(_) {}
  };
  dataChannel.onclose = () => { statusEl.textContent = "🔌 Đã ngắt kết nối"; game.running = false; };
}

function sendMsg(obj) {
  if (dataChannel && dataChannel.readyState === "open") {
    dataChannel.send(JSON.stringify(obj));
  }
}

/* --- Encoding SDP an toàn để dán --- */
function encodeSDP(sdp) { return btoa(unescape(encodeURIComponent(sdp))); }
function decodeSDP(str) { return decodeURIComponent(escape(atob(str.trim()))); }

/* =========================================================
   HOST
========================================================= */
$("btnCreate").onclick = async () => {
  $("hostArea").classList.remove("hidden");
  $("joinArea").classList.add("hidden");
  $("offerOutput").value = "Đang tạo offer...";

  createPeer(true);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await waitIceComplete(pc);
  $("offerOutput").value = encodeSDP(pc.localDescription.sdp);
  log("Offer sẵn sàng — gửi cho Guest");
};

$("btnConnect").onclick = async () => {
  const ans = $("answerInput").value.trim();
  if (!ans) return alert("Dán Answer code vào đây!");
  try {
    const sdp = decodeSDP(ans);
    await pc.setRemoteDescription({ type: "answer", sdp });
    log("Đã set remote answer");
  } catch (e) {
    alert("Answer không hợp lệ: " + e.message);
  }
};

$("btnCopyOffer").onclick = () => copyText($("offerOutput").value);

/* =========================================================
   GUEST
========================================================= */
$("btnJoin").onclick = () => {
  $("joinArea").classList.remove("hidden");
  $("hostArea").classList.add("hidden");
};

$("btnGenAnswer").onclick = async () => {
  const off = $("offerInput").value.trim();
  if (!off) return alert("Dán Offer code vào đây!");
  try {
    createPeer(false);
    const sdp = decodeSDP(off);
    await pc.setRemoteDescription({ type: "offer", sdp });

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await waitIceComplete(pc);
    $("answerOutput").value = encodeSDP(pc.localDescription.sdp);
    log("Answer sẵn sàng — gửi lại Host");
  } catch (e) {
    alert("Offer không hợp lệ: " + e.message);
  }
};

$("btnCopyAnswer").onclick = () => copyText($("answerOutput").value);

/* =========================================================
   HELPERS
========================================================= */
function waitIceComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === "complete") return resolve();
    const t = setTimeout(resolve, 3000); // timeout fallback
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === "complete") {
        clearTimeout(t);
        resolve();
      }
    };
  });
}

function copyText(text) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = "✅ Đã copy!";
    setTimeout(() => btn.textContent = old, 1200);
  });
}

function log(msg) { statusEl.textContent = msg; console.log("[PP]", msg); }

/* =========================================================
   BẮT ĐẦU GAME (2 bên đều chạy)
========================================================= */
function startGame(role) {
  if (game.running) return;
  game.myRole = role;
  game.running = true;
  menuEl.classList.add("hidden");
  gameEl.classList.remove("hidden");

  // Host là người mô phỏng vật lý
  if (role === "host") {
    resetBall(Math.random() < 0.5 ? -1 : 1);
  }
  statusEl.textContent = role === "host"
    ? "Bạn là PADDLE TRÁI (Host) 👈"
    : "Bạn là PADDLE PHẢI (Guest) 👉";

  requestAnimationFrame(loop);
}

function resetBall(dir = 1) {
  game.ball.x = W / 2;
  game.ball.y = H / 2;
  const speed = BALL_SPEED_INIT;
  const angle = (Math.random() - 0.5) * Math.PI / 3;
  game.ball.vx = Math.cos(angle) * speed * dir;
  game.ball.vy = Math.sin(angle) * speed;
}

/* =========================================================
   INPUT
========================================================= */
const MY_KEYS = new Set();
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","w","s","W","S"].includes(e.key)) {
    e.preventDefault();
    MY_KEYS.add(e.key.toLowerCase());
    sendInput();
  }
});
window.addEventListener("keyup", e => {
  MY_KEYS.delete(e.key.toLowerCase());
  sendInput();
});

/* Điều khiển bằng chạm / chuột trên canvas */
let pointerActive = false;
function pointerY(ev) {
  const rect = canvas.getBoundingClientRect();
  const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
  return (clientY - rect.top) * (H / rect.height);
}
["touchstart","touchmove","mousedown","mousemove"].forEach(evName => {
  canvas.addEventListener(evName, e => {
    if (evName === "mousemove" && e.buttons !== 1) return;
    if (evName === "touchstart" || evName === "mousedown") pointerActive = true;
    if (!pointerActive) return;
    e.preventDefault();
    const y = pointerY(e);
    setPointerTarget(y);
  }, { passive: false });
});
["touchend","touchcancel","mouseup","mouseleave"].forEach(evName => {
  canvas.addEventListener(evName, () => { pointerActive = false; }, { passive: true });
});

let pointerTargetY = null;
function setPointerTarget(y) {
  pointerTargetY = y;
  sendInput();
}

function sendInput() {
  // Chỉ gửi khi là guest (host tự tính)
  if (game.myRole !== "guest") return;
  let dir = 0;
  if (MY_KEYS.has("arrowup") || MY_KEYS.has("w")) dir -= 1;
  if (MY_KEYS.has("arrowdown") || MY_KEYS.has("s")) dir += 1;

  // Nếu có pointer → ghi đè
  if (pointerTargetY !== null) {
    const paddle = game.right;
    const center = paddle.y + PADDLE_H / 2;
    if (Math.abs(pointerTargetY - center) > 6) dir = pointerTargetY > center ? 1 : -1;
    else dir = 0;
  }
  sendMsg({ t: "input", dir });
  // Guest tự cập nhật paddle của mình cho mượt
  game.right.dy = dir * PADDLE_SPEED;
}

/* =========================================================
   NET MESSAGE HANDLER
========================================================= */
function handleNetMessage(msg) {
  if (msg.t === "input" && game.myRole === "host") {
    game.right.dy = msg.dir * PADDLE_SPEED;
  }
  else if (msg.t === "state" && game.myRole === "guest") {
    game.ball.x = msg.bx;
    game.ball.y = msg.by;
    game.left.y  = msg.ly;
    game.left.dy = msg.ldy;
    game.right.y = msg.ry;
    game.scoreL = msg.sl;
    game.scoreR = msg.sr;
    scoreLeftEl.textContent = msg.sl;
    scoreRightEl.textContent = msg.sr;
  }
  else if (msg.t === "reset" && game.myRole === "guest") {
    // đã có state gửi kèm, không cần gì thêm
  }
}

/* =========================================================
   GAME LOOP
========================================================= */
let lastTime = performance.now();
let netAccum = 0;

function loop(now) {
  if (!game.running) return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (game.myRole === "host") {
    updateHost(dt);
    // Gửi state cho guest ~30fps
    netAccum += dt;
    if (netAccum > 1/30) {
      sendMsg({
        t: "state",
        bx: game.ball.x, by: game.ball.y,
        ly: game.left.y, ldy: game.left.dy,
        ry: game.right.y,
        sl: game.scoreL, sr: game.scoreR
      });
      netAccum = 0;
    }
  } else {
    // Guest: chỉ dự đoán nhẹ paddle phải cho mượt
    game.right.y += game.right.dy * dt;
    game.right.y = clamp(game.right.y, 0, H - PADDLE_H);
  }

  render();
  requestAnimationFrame(loop);
}

function updateHost(dt) {
  // Host điều khiển paddle TRÁI bằng bàn phím / chuột của mình
  let dir = 0;
  if (MY_KEYS.has("arrowup") || MY_KEYS.has("w")) dir -= 1;
  if (MY_KEYS.has("arrowdown") || MY_KEYS.has("s")) dir += 1;
  if (pointerTargetY !== null) {
    const center = game.left.y + PADDLE_H / 2;
    if (Math.abs(pointerTargetY - center) > 6)
      dir = pointerTargetY > center ? 1 : -1;
    else dir = 0;
  }
  game.left.dy = dir * PADDLE_SPEED;

  // Update paddles
  game.left.y  = clamp(game.left.y  + game.left.dy  * dt, 0, H - PADDLE_H);
  game.right.y = clamp(game.right.y + game.right.dy * dt, 0, H - PADDLE_H);

  // Update ball
  const b = game.ball;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // Tường trên/dưới
  if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy = Math.abs(b.vy); }
  if (b.y + BALL_R > H) { b.y = H - BALL_R; b.vy = -Math.abs(b.vy); }

  // Paddle trái
  if (b.x - BALL_R < PADDLE_W && b.vx < 0 &&
      b.y > game.left.y && b.y < game.left.y + PADDLE_H) {
    b.x = PADDLE_W + BALL_R;
    bounceOffPaddle(game.left, 1);
  }
  // Paddle phải
  if (b.x + BALL_R > W - PADDLE_W && b.vx > 0 &&
      b.y > game.right.y && b.y < game.right.y + PADDLE_H) {
    b.x = W - PADDLE_W - BALL_R;
    bounceOffPaddle(game.right, -1);
  }

  // Ghi điểm
  if (b.x - BALL_R < 0) {
    game.scoreR++;
    checkWin();
    resetBall(1);
  } else if (b.x + BALL_R > W) {
    game.scoreL++;
    checkWin();
    resetBall(-1);
  }

  scoreLeftEl.textContent = game.scoreL;
  scoreRightEl.textContent = game.scoreR;
}

function bounceOffPaddle(paddle, dirX) {
  const b = game.ball;
  const paddleCenter = paddle.y + PADDLE_H / 2;
  const rel = (b.y - paddleCenter) / (PADDLE_H / 2); // -1..1
  const maxAngle = Math.PI / 3.5;
  const angle = rel * maxAngle;

  // Tăng tốc nhẹ mỗi lần đánh
  const speed = Math.min(Math.hypot(b.vx, b.vy) * 1.06, 900);
  b.vx = Math.cos(angle) * speed * dirX;
  b.vy = Math.sin(angle) * speed;
}

function checkWin() {
  if (game.scoreL >= WIN_SCORE || game.scoreR >= WIN_SCORE) {
    const who = game.scoreL >= WIN_SCORE ? "TRÁI (Host)" : "PHẢI (Guest)";
    setTimeout(() => {
      alert("🏆 " + who + " thắng!");
      game.scoreL = 0; game.scoreR = 0;
      scoreLeftEl.textContent = "0";
      scoreRightEl.textContent = "0";
      resetBall(Math.random() < 0.5 ? -1 : 1);
    }, 50);
  }
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* =========================================================
   RENDER
========================================================= */
function render() {
  // Nền
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, W, H);

  // Lưới giữa
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 14]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddle trái (gradient xanh)
  const gradL = ctx.createLinearGradient(0, 0, PADDLE_W, 0);
  gradL.addColorStop(0, "#38bdf8");
  gradL.addColorStop(1, "#0ea5e9");
  ctx.fillStyle = gradL;
  roundRect(0, game.left.y, PADDLE_W, PADDLE_H, 6);

  // Paddle phải (gradient tím)
  const gradR = ctx.createLinearGradient(W - PADDLE_W, 0, W, 0);
  gradR.addColorStop(0, "#8b5cf6");
  gradR.addColorStop(1, "#a78bfa");
  ctx.fillStyle = gradR;
  roundRect(W - PADDLE_W, game.right.y, PADDLE_W, PADDLE_H, 6);

  // Bóng + glow
  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 22;
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.arc(game.ball.x, game.ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Viền
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

/* Vẽ lần đầu để canvas không trống */
render();

/* =========================================================
   HIỂN THỊ NÚT COPY ĐÚNG (dùng event.target)
========================================================= */
document.addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") e.target._lastClick = true;
});
</script>
</body>
</html>
